name: 功能建议（Feature request）
description: 新增角色、改动闸门或接入新流程
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先读 `ARCHITECTURE.md`：角色、闸门、状态机的边界写得很清楚，
        改动越靠近「让 agent 自己给自己放行」，越需要解释为什么。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在的分工在什么场景下不够用
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 新角色？新闸门？还是现有角色扩权？请说明权限变化
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: 对闸门的影响
      description: 通过条件如何变化，失败后回退到哪个角色
  - type: textarea
    id: risks
    attributes:
      label: 风险
      description: 例如放宽沙箱、增加自动执行的外部命令
